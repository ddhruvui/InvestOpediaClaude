# ============================================================================
# AGGRESSIVE CASH book (branch aggressive-short-horizon) — NO borrowed money.
# h40 vertical, top-5 concentration, 20% protective vol target, hard 1.0x
# gross cap with exact capital recycling, MOO-netted costs. Adopted from M17
# rounds A-F on volume crimtr8kbf (2026-08-30): 18.8% CAGR / SR 0.92 /
# MDD -51% on the 19y walk-forward; ~34-session average hold.
# Run via SYSTEM_CONFIG=configs/system_aggressive.yaml. NOT the production
# config; never point it at the production volume.
# ============================================================================
# ============================================================================
# EOD Swing & Position Trading System — single source of truth (§3)
# SHA-256 of this file = config_hash stamped on every artifact (G-10).
# Defaults are the spec's values; where the spec gives a range, the default
# sits inside it and search is confined to that range. `req` = must be set
# explicitly before live.
# ============================================================================

# ---- §3.1 Data & universe ---------------------------------------------------
universe:
  mode: top1000_dollar_volume          # or sp500_historical
  size: 1000
  liquidity_window_days: 63            # [IMPL] median daily dollar volume window
  refresh: monthly                     # 10% entry/exit hysteresis buffer [IMPL]
  hysteresis: 0.10
  min_price: 5.0                       # USD [IMPL]
  min_mcap: 300.0e+6                   # USD [IMPL]
data:
  vendors: sharadar+eodhd
  index_symbol: SPY
  snapshot_immutable: true
  m1_dir: /workspace/m1                # M1 landing layer (build_m1.py output)
  raw_eod_dir: /workspace/data         # raw vendor JSON (news, universe, market)
  out_dir: /workspace/derived          # M2+ derived tables

# ---- §3.2 Labels & barriers -------------------------------------------------
labels:
  horizons: [5, 20, 60]                # trading days; optional 120-250 head [MAY]
  lag_days: 1                          # FIXED — never exposed for tuning (G-02)
  cs_norm: demean                      # {demean, rank, zscore}
  task: regression                     # {regression, top_vs_bottom_tercile_classification}
barrier:
  m: 1.5                               # in [1, 2]
  h_days: 40                           # ~34-session avg hold; was 60 adopted
                                       #   2026-08-23 (M17 exp: churn cost 3.7%->1.3%/yr,
                                       #   net SR 0.556->0.724; see reports/experiments/)
  sigma_span: 32                       # EWMA span in [20, 60]; 32 == lambda 0.94 (C-02)
  tie_break: stop_first                # [IMPL] both barriers in one bar -> stop first

# ---- §3.3 Models ------------------------------------------------------------
lgbm:
  objective: mse                       # {mse, lambdarank}
  learning_rate: 0.1                   # search in [0.05, 0.2]
  num_leaves: 210
  max_depth: 8
  colsample_bytree: 0.8879
  subsample: 0.8789
  lambda_l1: 205.7
  lambda_l2: 581.0
  num_boost_round: 1000
  early_stopping_rounds: 50
  deterministic: true                  # + force_col_wise, fixed seed (G-10)
gru:
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  lr_start: 1.0e-3                     # Adam; /10 on valid-RankIC plateau (patience 3)
  lr_end: 1.0e-4
  lr_plateau_patience: 3
  lookback: 60
  n_features: 20                       # top-k by LightGBM gain importance
  batch_size: 2048                     # [IMPL] date-grouped batches
  early_stop_patience: 5               # [IMPL] on validation RankIC
  seed_ensemble: 3                     # [IMPL] average 3-5 random inits
cnn:
  image_days: [5, 20, 60]              # 15x32 / 60x64 / 180x96 (WxH), 3 px/day
  supervision_horizon: 20              # R20; label = 1[y_20 > 0] with G-02 lag
  blocks: {5: 2, 20: 3, 60: 4}
  base_filters: 64                     # doubling per block 64->128->256->512 (NOT 32)
  lr: 1.0e-5
  batch_size: 128
  dropout_fc: 0.5
  early_stop_patience: 2
  n_retrainings_avg: 5
  train_policy: train_once             # annual refresh [MAY]; JKX held ~19y
  deploy_config: I5_R20_quarterly
gkx_nn:
  enabled: false
sharpe_net:
  enabled: false
alphas101:
  enabled: false

# ---- §3.4 Ensemble, meta, sleeves, regime -----------------------------------
ensemble:
  method: mean_rank
  members: [lgbm_h5, lgbm_h20, lgbm_h60, gru_h5, gru_h20, gru_h60, cnn_I5R20]
  weights: equal                       # [IMPL] tunable via M17 (counted in DSR)
meta:
  enabled: true                        # Stage 3
  p_threshold: 0.55                    # search [0.50, 0.65] [IMPL range]
  p_threshold_fast: 0.65               # G-17/M11-03 elevated bar for sub-5d entries
  sizing: prop_p_minus_half            # size ∝ (p − 0.5), capped by vol-target rules
  num_leaves: 31                       # [IMPL] "a small LightGBM works"
  learning_rate: 0.05
  num_boost_round: 400
  early_stopping_rounds: 50
mom_sleeve:
  formation: 12-1
  K_holding_months: 12                 # J,K in {3,6,9,12}; overlapping 1/K tranches
  long_only: true
  vol_target: 0.12                     # Barroso–Santa-Clara: 12% / sigma(6m sleeve vol)
  scale_cap: 2.0
  risk_budget: 0.30                    # of gross
pairs:
  enabled: false
  exit_z: 0.25                         # [IMPL]
  stop_z: 3.5                          # [IMPL]
  max_hold_days: 40                    # [IMPL]
tsmom:
  enabled: false
regime:
  mode: ma200_vol                      # or hmm
  vol_threshold_ann: 0.25              # 21-day realized index vol, annualized [IMPL]
  gross_multiplier_risk_off: 0.5
hmm:
  n_states: 2

# ---- §3.5 Portfolio, costs, execution, compliance ---------------------------
port:
  selection: top_n_long                # aggressive cash: absolute top-N book
  top_n: 5                             # names held (winner of rounds A-F)
  hedge: none                          # cash book — unhedged (hedging kills it, measured)
  tranches: 15                         # Stage-1 fixed hold = 15 sessions
  weighting: inverse_vol
  single_name_cap: 0.30                # concentrated book (5 names)
  vol_target_ann: 0.20                 # protective: de-risks crises under the cash cap
  vol_target_scale_cap: 2.5            # [IMPL]
  gross_cap: 1.0                       # CASH ONLY — never borrow
  gross_cap_exact: true                # recycle capital on actual exit dates
  no_trade_band: 0.20                  # skip if |dw| < 20% of target or < 10 bps NAV
  no_trade_band_nav_bps: 10
  hedge_beta_window: 60                # [IMPL] rolling beta window (Q-019)
  adv_participation_cap: 0.05          # [IMPL] <=5% of 21d ADV per order
  skip_earnings_entries: false         # F8 option; recommended true for short holds
  skip_earnings_window: 2
size:
  vol_estimator: ewma_span32           # or realized_20_60d [MAY]
cost:
  per_trade_bps: 15                    # Stage-1 anchor; sensitivity {5, 15, 30}
  net_moo_at_open: true                # net same-name MOO exit+entry legs
  sensitivity_bps: [5, 15, 30]
  borrow_gc_bps_yr: 50                 # GC ~0.3–1%/yr; per-name HTB override table
  slippage_bps: 0                      # -> measured (M18/M15-03, >=60 fills)
exec:
  order_type: MOO
  broker: IBKR
  barrier_orders: stop_limit_gtc
pdt:
  account_equity: null                 # req — set before live
  mode_under_25k: defer_to_next_open   # [IMPL]
tax:
  ordinary_rate: null                  # req — after-tax Sharpe reporting
ops:
  max_daily_loss_pct: 0.02             # kill switch [IMPL value]

# ---- §3.6 Validation & HPO --------------------------------------------------
val:
  scheme: purged_walk_forward          # train ~5y / valid ~2y / step 1y [IMPL step]
  train_years: 5
  valid_years: 2
  step_years: 1
  fk_alternative: false                # 750d train / 250d test, step 250
  embargo_days: 21
  cpcv_n_groups: 6
  cpcv_k_test: 2                       # -> 15 splits, 5 paths
  holdout_years: 1                     # final untouched segment, opened once
  retrain_cadence: monthly             # GBDT/NN; CNN exempt (train-once)
hpo:
  engine: optuna
  objective: rank_ic                   # purged-CV Rank IC or net Sharpe
  max_trials_per_model: 100
continual:                             # [IMPL] daily warm-start learning (predict job)
  enabled: true
  model_dir: /workspace/models         # champion store on the network volume
  panel_tail_years: 5                  # update-mode data window; must cover feature
                                       #   warmup (273) + train + purge + valid + labels
  update_train_sessions: 252           # warm-fit window: newest labeled year before valid
  update_boost_rounds: 200             # max extra trees per daily update
  update_learning_rate: 0.02           # gentler than the full-fit 0.1
  full_refit_sessions: 21              # full retrain cadence = val.retrain_cadence monthly
  keep_model_files: 6                  # per-head history retained in the store
seed:
  global: 20260717                     # [IMPL value]; propagated everywhere
